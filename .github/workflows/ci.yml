name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env: 
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup update nightly && rustup default nightly && rustup component add clippy
      
      - name: Build crates
        run: cargo build --verbose

      - name: Run benchmarks
        run: cargo bench --verbose

      - name: Install valgrind (only on Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y valgrind

      - name: Run benchmarks with memory profiling
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            BENCH_BINARY=$(ls target/release/deps/my_benchmark-*)
            valgrind --tool=massif --stacks=yes --massif-out-file=massif.out $BENCH_BINARY
            ms_print massif.out > memory_report.txt
            cat memory_report.txt
          fi

