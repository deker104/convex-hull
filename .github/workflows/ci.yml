name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env: 
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup update nightly && rustup default nightly && rustup component add clippy
      
      - name: Build crates
        run: cargo build --verbose
      
      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy --verbose

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Find benchmark binary
        run: echo "BENCH_BINARY=$(ls target/release/deps/my_benchmark-*)" >> $GITHUB_ENV

      - name: Run benchmarks with memory profiling
        run: |
          valgrind --tool=massif --stacks=yes --massif-out-file=massif.out $BENCH_BINARY
          if [ -f massif.out ]; then
            ms_print massif.out > memory_report.txt
            cat memory_report.txt
          else
            echo "Massif output file not found!"
            exit 1
          fi

      - name: Run benchmarks (without Valgrind)
        run: cargo bench --verbose
